name: Vonix — testes e build (sem deploy)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vonix-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - name: Dependências reprodutíveis
        run: bun install --frozen-lockfile
      - name: Testes automatizados
        run: bun run test
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Build sem publicação
        run: bun run build
